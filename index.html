<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>MeetingFlow｜AI 會議紀錄</title><style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#e5e7eb;background:#0b1220}*{box-sizing:border-box}body{margin:0}header{background:#111b2d;border-bottom:1px solid #344054;padding:18px 4vw;display:flex;align-items:center;justify-content:space-between;gap:12px}main{max-width:1150px;margin:auto;padding:24px 16px}.logo{font-weight:800;font-size:22px}.sub{color:#9da9bf;font-size:13px}.panel{background:#151f32;border:1px solid #344054;border-radius:16px;padding:20px;margin-bottom:18px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.split{display:grid;grid-template-columns:2fr 1fr;gap:18px}input,textarea,select{background:#0b1425;border:1px solid #475569;color:#f8fafc;padding:12px;border-radius:9px;font:inherit;max-width:100%}input[type=text]{width:100%}button{border:0;background:#3b82f6;color:white;border-radius:10px;padding:12px 15px;font:inherit;cursor:pointer}button.secondary{background:#334155}button.red{background:#be4545}button:disabled{opacity:.4;cursor:not-allowed}h1{margin:0;font-size:23px}h2{font-size:18px;margin:0 0 15px}p{line-height:1.7}.log{min-height:260px;max-height:490px;overflow:auto}.segment{border-bottom:1px solid #334155;padding:12px 0}.segment .meta{font-size:12px;color:#9da9bf;margin-bottom:8px}.segment textarea{width:100%;min-height:68px}.segment select{max-width:130px}.status{padding:10px 14px;border-radius:10px;background:#24354c;color:#d3e2f7}.notice{color:#f7c97d}.badge{padding:7px 11px;background:#26374e;border-radius:20px}.muted{color:#aebcd0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.speaker{display:flex;align-items:center;gap:10px;margin:10px 0}.speaker input{flex:1;min-width:80px}@media(max-width:750px){.split{grid-template-columns:1fr}header{align-items:start;flex-direction:column}}@media print{header,.controls,.notice,button{display:none!important}body{background:white;color:black}.panel{border:0;background:white;color:black}}
</style></head><body><header><div><div class="logo">◉ MeetingFlow</div><div class="sub">現場會議錄音與逐字稿管理 · v1.00</div></div><span id="state" class="badge">尚未錄音</span></header>
<main><section class="panel"><h1>會議控制台</h1><p class="muted">筆電與手機皆可使用內建麥克風，請先取得與會者錄音同意。</p><div class="row"><input id="meetingName" type="text" placeholder="會議名稱" value="新會議" style="flex:2"><select id="device" aria-label="音訊輸入裝置"><option value="">預設麥克風</option></select></div><div class="toolbar controls"><button id="start">● 開始錄音</button><button class="red" id="stop" disabled>■ 結束並儲存錄音</button><button class="secondary" id="downloadAudio" disabled>下載錄音</button><button class="secondary" id="exportTxt">匯出逐字稿</button><button class="secondary" id="exportJson">匯出 JSON</button></div><p><strong id="clock">00:00:00</strong>　<span class="status" id="status">等待麥克風授權</span></p><p class="notice">目前是錄音及人工校正可用的第一版。AI 即時轉文字、發言者自動辨識及 Supabase 雲端同步尚未啟用；未接上 AI 服務前不會假裝辨識成功。</p></section>
<div class="split"><section class="panel"><h2>會議逐字稿</h2><div class="row controls"><button class="secondary" id="add">＋ 新增發言段落</button><span class="sub">可以先手動記錄或校正</span></div><div id="logs" class="log"></div></section><div><section class="panel"><h2>發言者管理</h2><div id="speakers"></div><button class="secondary controls" id="addSpeaker">＋ 新增發言者</button></section><section class="panel"><h2>會後重點</h2><textarea id="summary" style="width:100%;min-height:180px" placeholder="決議、待辦事項、會議摘要……"></textarea><p class="sub">摘要目前由使用者編輯；AI 摘要待後端串接。</p></section></div></div></main>
<script>
const $=id=>document.getElementById(id);let recorder,stream,chunks=[],blob=null,begin=0,timer=null;const cacheKey='meetingflow_draft_v1';let data={segments:[],speakers:['發言者 A','發言者 B','發言者 C'],summary:'',name:'新會議'};try{const d=JSON.parse(localStorage.getItem(cacheKey));if(d&&Array.isArray(d.segments)&&Array.isArray(d.speakers))data=d}catch(e){}$('meetingName').value=data.name;$('summary').value=data.summary;function save(){data.name=$('meetingName').value;data.summary=$('summary').value;localStorage.setItem(cacheKey,JSON.stringify(data))}function pad(n){return String(n).padStart(2,'0')}function stamp(seconds){return [Math.floor(seconds/3600),Math.floor(seconds/60)%60,seconds%60].map(pad).join(':')}function elapsed(){return begin?Math.floor((Date.now()-begin)/1000):0}function render(){const sp=$('speakers');sp.replaceChildren();data.speakers.forEach((s,i)=>{const r=document.createElement('div');r.className='speaker';const label=document.createElement('span');label.textContent=String.fromCharCode(65+i);const inp=document.createElement('input');inp.value=s;inp.setAttribute('aria-label','發言者 '+(i+1));inp.oninput=()=>{data.speakers[i]=inp.value;save();renderSegments()};r.append(label,inp);sp.append(r)});renderSegments()}function renderSegments(){const root=$('logs');root.replaceChildren();if(!data.segments.length){let p=document.createElement('p');p.className='muted';p.textContent='還沒有發言紀錄。可新增段落；AI 模組接入後將自動新增。';root.append(p)}data.segments.forEach((s,i)=>{const c=document.createElement('div');c.className='segment';const meta=document.createElement('div');meta.className='meta';meta.textContent=s.time;const row=document.createElement('div');row.className='row';const choice=document.createElement('select');data.speakers.forEach((name,j)=>{const o=document.createElement('option');o.value=j;o.textContent=name;choice.append(o)});choice.value=s.speaker;choice.onchange=()=>{s.speaker=Number(choice.value);save()};const del=document.createElement('button');del.className='secondary';del.textContent='刪除';del.onclick=()=>{data.segments.splice(i,1);save();renderSegments()};row.append(choice,del);const t=document.createElement('textarea');t.value=s.text;t.placeholder='發言內容';t.oninput=()=>{s.text=t.value;save()};c.append(meta,row,t);root.append(c)})}function addSegment(){data.segments.push({time:stamp(elapsed()),speaker:0,text:''});save();renderSegments();$('logs').scrollTop=$('logs').scrollHeight}
$('add').onclick=addSegment;$('addSpeaker').onclick=()=>{data.speakers.push('發言者 '+String.fromCharCode(65+data.speakers.length));save();render()};$('meetingName').oninput=save;$('summary').oninput=save;async function devices(){try{const ds=await navigator.mediaDevices.enumerateDevices();$('device').replaceChildren();const def=document.createElement('option');def.value='';def.textContent='預設麥克風';$('device').append(def);ds.filter(x=>x.kind==='audioinput').forEach(x=>{const o=document.createElement('option');o.value=x.deviceId;o.textContent=x.label||'麥克風';$('device').append(o)})}catch(e){}}if(navigator.mediaDevices)devices();
$('start').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('此瀏覽器不支援錄音 API');stream=await navigator.mediaDevices.getUserMedia({audio:$('device').value?{deviceId:{exact:$('device').value},echoCancellation:true,noiseSuppression:true}: {echoCancellation:true,noiseSuppression:true}});const type=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(x=>MediaRecorder.isTypeSupported(x));chunks=[];blob=null;recorder=new MediaRecorder(stream,type?{mimeType:type}:{});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});$('downloadAudio').disabled=false;stream.getTracks().forEach(t=>t.stop());$('status').textContent='錄音已保存在本次瀏覽器工作階段，請下載備份';$('state').textContent='已結束';clearInterval(timer)};recorder.start(1000);begin=Date.now();$('start').disabled=true;$('stop').disabled=false;$('state').textContent='● 錄音中';$('status').textContent='正在錄製現場聲音';timer=setInterval(()=>$('clock').textContent=stamp(elapsed()),500);await devices()}catch(e){$('status').textContent='無法錄音：'+e.message;stream?.getTracks().forEach(t=>t.stop())}};
$('stop').onclick=()=>{if(recorder?.state==='recording'){recorder.stop();$('stop').disabled=true;$('start').disabled=false;save()}};
function download(b,filename){const a=document.createElement('a');const u=URL.createObjectURL(b);a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}function safeName(){return ($('meetingName').value||'會議').replace(/[\\/:*?"<>|]/g,'_').slice(0,60)}$('downloadAudio').onclick=()=>{if(blob)download(blob,safeName()+'.'+(blob.type.includes('mp4')?'m4a':'webm'))};$('exportTxt').onclick=()=>{let s=$('meetingName').value+'\n\n'+data.segments.map(x=>'['+x.time+'] '+(data.speakers[x.speaker]||'未知')+'：'+x.text).join('\n')+'\n\n會後重點\n'+$('summary').value;download(new Blob([s],{type:'text/plain;charset=utf-8'}),safeName()+'.txt')};$('exportJson').onclick=()=>{save();download(new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),safeName()+'.json')};window.addEventListener('beforeunload',e=>{if(recorder?.state==='recording'){e.preventDefault();e.returnValue=''}});render();
</script></body></html>
